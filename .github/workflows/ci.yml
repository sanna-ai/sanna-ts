name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (SAN-228)
        # Fails CI on HIGH or CRITICAL advisories in production deps.
        # Dev deps not gated here; they have independent upgrade cadence.
        # See SAN-253 for upstream MCP SDK coordination on transitive CVEs.
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        env:
          # Bypass the ReceiptStore temp-dir guard (store.ts:99) for CI test runs.
          # LocalSQLiteSink tests use /tmp paths by design; guard is explicitly
          # bypassable via this env var per its own error message.
          SANNA_ALLOW_TEMP_DB: "1"
        run: npm test

      - name: Validate state doc (SAN-326)
        run: npx tsx tools/generate-state-doc.ts --check
